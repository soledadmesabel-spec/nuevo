// ---------- Wrapper de google.script.run como Promesa ----------
function gs(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(err))
      [fnName](...args);
  });
}

// ---------- Utilidades de formato WhatsApp (réplica de whatsappFormatter.ts) ----------
function formatToWhatsAppMessage(pedido, options) {
  options = options || {};
  const formatStyle = options.formatStyle || 'clasico';
  const includeSolicitante = !!options.includeSolicitante;

  const saludo = (pedido.saludo || '').trim() || 'Buen día dra. Yuly';
  const tipoTramite = (pedido.tipoTramite || '').trim();
  const expediente = (pedido.expediente || '').trim();
  const juzgado = (pedido.juzgado || '').trim();
  const materia = (pedido.materia || '').trim();
  const especialista = (pedido.especialista || '').trim();
  const requerimiento = (pedido.requerimiento || '').trim();
  const solicitante = (pedido.solicitante || '').trim();
  const telefono = (pedido.telefono || '').trim();
  const colegiatura = (pedido.colegiaturaOCasilla || '').trim();

  if (formatStyle === 'clasico') {
    let msg = saludo + '\n';
    if (tipoTramite) msg += 'TIPO DE TRÁMITE: ' + tipoTramite + '\n';
    msg += 'EXPEDIENTE     : ' + expediente + '\n';
    msg += 'JUZGADO        : ' + juzgado + '\n';
    msg += 'MATERIA        : ' + materia + '\n';
    msg += 'ESPECIALISTA   : ' + especialista + '\n';
    msg += 'REQUERIMIENTO  : ' + requerimiento;
    if (includeSolicitante && (solicitante || telefono || colegiatura)) {
      msg += '\nSOLICITANTE    : ' + solicitante + (colegiatura ? ' (' + colegiatura + ')' : '') + (telefono ? ' - Cel: ' + telefono : '');
    }
    return msg;
  }

  if (formatStyle === 'estructurado_emoji') {
    let msg = saludo + '\n\n';
    msg += '⚖️ *REGISTRO DE PEDIDO JUDICIAL*\n';
    msg += '─────────────────────────\n';
    if (tipoTramite) msg += '📋 *TIPO DE TRÁMITE :* ' + tipoTramite + '\n';
    msg += '📁 *EXPEDIENTE      :* ' + expediente + '\n';
    msg += '🏛️ *JUZGADO         :* ' + juzgado + '\n';
    msg += '📜 *MATERIA         :* ' + materia + '\n';
    msg += '👤 *ESPECIALISTA    :* ' + especialista + '\n';
    msg += '─────────────────────────\n';
    msg += '📝 *REQUERIMIENTO   :*\n' + requerimiento + '\n';
    if (includeSolicitante && (solicitante || telefono || colegiatura)) {
      msg += '─────────────────────────\n';
      msg += '🧑‍💼 *SOLICITANTE:* ' + (solicitante || 'Abogado patrocinante') + '\n';
      if (colegiatura) msg += '🔖 *CASILLA/REG :* ' + colegiatura + '\n';
      if (telefono) msg += '📱 *TELÉFONO    :* ' + telefono + '\n';
    }
    return msg.trim();
  }

  // compacto
  let msg = '*' + saludo + '*\n';
  if (tipoTramite) msg += '*Trámite:* ' + tipoTramite + ' | ';
  msg += '*Exp:* ' + expediente + ' | *Juzgado:* ' + juzgado + ' | *Materia:* ' + materia + ' | *Esp:* ' + especialista + '\n';
  msg += '*Requerimiento:* ' + requerimiento;
  if (includeSolicitante && solicitante) msg += '\n*Por:* ' + solicitante + ' (' + telefono + ')';
  return msg;
}

function generateWhatsAppLink(message, phoneNumber) {
  const cleanPhone = phoneNumber ? phoneNumber.replace(/[^0-9]/g, '') : '';
  const encoded = encodeURIComponent(message);
  if (cleanPhone && cleanPhone.length >= 8) return 'https://wa.me/' + cleanPhone + '?text=' + encoded;
  return 'https://api.whatsapp.com/send?text=' + encoded;
}

function parseRawWhatsAppMessage(rawText) {
  const result = {};
  if (!rawText) return result;
  const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);

  if (lines.length > 0 && /^(buen|buena|hola|estimad|dra\.|dr\.)/i.test(lines[0])) {
    result.saludo = lines[0];
  }

  const patterns = [
    ['tipoTramite', /(?:tipo\s*de\s*tr[aá]mite|tramite)\s*[:=]\s*(.+)/i],
    ['expediente', /(?:expediente|exp\.?)\s*[:=]\s*([0-9a-zA-Z\-_/]+)/i],
    ['juzgado', /(?:juzgado|organo\s*jurisdiccional)\s*[:=]\s*(.+)/i],
    ['materia', /(?:materia)\s*[:=]\s*(.+)/i],
    ['especialista', /(?:especialista|secretario|asistente)\s*[:=]\s*(.+)/i],
    ['solicitante', /(?:solicitante|abogado|letrado|por)\s*[:=]\s*(.+)/i],
    ['telefono', /(?:tel[eé]fono|celular|cel|whatsapp|ws)\s*[:=]\s*([+0-9\s\-]+)/i]
  ];
  patterns.forEach(([key, regex]) => {
    const m = rawText.match(regex);
    if (m && m[1]) result[key] = m[1].trim();
  });

  const reqMatch = rawText.match(/(?:requerimiento|solicitud|motivo|pedido|detalle)\s*[:=]\s*([\s\S]+?)(?=(?:SOLICITANTE|TEL|CASILLA|────────|━━━━━━━━|$))/i);
  if (reqMatch && reqMatch[1]) result.requerimiento = reqMatch[1].trim();

  if (!result.expediente) {
    const expDirect = rawText.match(/(\d{4,5}-\d{4}-\d+-\d{4}-[A-Z]{2}-[A-Z]{2}-\d{1,2})/);
    if (expDirect) result.expediente = expDirect[1];
  }
  return result;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }

  // ============================================================
  // TAB: SEGUIMIENTO PÚBLICO
  // ============================================================
  setSeguimientoSearch(v) { S.ui.seguimientoSearch = v; this.renderMain(); },

  selectForEdit(id) {
    const p = S.pedidos.find(x => x.id === id);
    if (!p) return;
    S.currentPedido = Object.assign({}, p);
    S.activeTab = 'nuevo';
    this.toast('Solicitud ' + p.expediente + ' cargada en el formulario.');
    this.renderAll();
  },

  tplSeguimiento() {
    const q = S.ui.seguimientoSearch.toLowerCase();
    const list = S.pedidos.filter(p =>
      !q || (p.expediente || '').toLowerCase().includes(q) || (p.juzgado || '').toLowerCase().includes(q) || (p.especialista || '').toLowerCase().includes(q)
    );
    return `
    <div class="space-y-4">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
        <h2 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight mb-3">Consultar Estado de mi Pedido</h2>
        <input type="text" value="${esc(S.ui.seguimientoSearch)}" oninput="App.setSeguimientoSearch(this.value)" placeholder="Ingrese N° de Expediente (ej: 02098-2015...), Juzgado o Especialista..." class="w-full px-4 py-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
      </div>
      <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider px-1">${list.length} resultado(s)</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        ${list.map(p => this.tplPedidoCard(p, false)).join('') || '<div class="col-span-2 text-center text-sm text-slate-500 py-10">No se encontraron pedidos.</div>'}
      </div>
    </div>`;
  },

  tplPedidoCard(p, adminMode) {
    const estadoClass = ESTADO_COLORS[p.estado] || ESTADO_COLORS['Pendiente'];
    const prioClass = PRIORIDAD_COLORS[p.prioridad] || PRIORIDAD_COLORS['Normal'];
    return `
    <div class="bg-white rounded-xl border border-slate-200/80 p-4 hover:shadow-md transition-shadow cursor-pointer" onclick="App.selectForEdit('${p.id}')">
      <div class="flex items-start justify-between gap-2 mb-2">
        <span class="font-mono text-xs font-bold text-slate-800">${esc(p.expediente)}</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${estadoClass}">${esc(p.estado)}</span>
      </div>
      <div class="text-xs text-slate-600 space-y-0.5">
        <div><span class="font-semibold text-slate-700">Juzgado:</span> ${esc(p.juzgado)}</div>
        <div><span class="font-semibold text-slate-700">Materia:</span> ${esc(p.materia)}</div>
        <div><span class="font-semibold text-slate-700">Especialista:</span> ${esc(p.especialista)}</div>
      </div>
      <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-100">
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${prioClass}">${esc(p.prioridad)}</span>
        <span class="text-[10px] text-slate-400">${p.fechaCreacion ? new Date(p.fechaCreacion).toLocaleDateString() : ''}</span>
      </div>
      ${adminMode && p.observaciones ? `<div class="mt-2 text-[11px] text-slate-500 bg-slate-50 rounded-lg p-2">${esc(p.observaciones)}</div>` : ''}
    </div>`;
  },

  // ============================================================
  // TAB: BANDEJA ADMIN
  // ============================================================
  setBandejaSearch(v) { S.ui.bandejaSearch = v; this.renderMain(); },
  setBandejaFiltro(campo, v) { S.ui['bandeja' + campo] = v; this.renderMain(); },

  bandejaFiltrados() {
    const q = S.ui.bandejaSearch.toLowerCase();
    return S.pedidos.filter(p => {
      if (S.ui.bandejaEstado !== 'todos' && p.estado !== S.ui.bandejaEstado) return false;
      if (S.ui.bandejaTipo !== 'todos' && p.tipoTramite !== S.ui.bandejaTipo) return false;
      if (S.ui.bandejaJuzgado !== 'todos' && p.juzgado !== S.ui.bandejaJuzgado) return false;
      if (!q) return true;
      return (p.expediente || '').toLowerCase().includes(q) || (p.especialista || '').toLowerCase().includes(q) ||
             (p.juzgado || '').toLowerCase().includes(q) || (p.materia || '').toLowerCase().includes(q) ||
             (p.solicitante || '').toLowerCase().includes(q);
    });
  },

  async refreshPedidos() {
    this.toast('Sincronizando...');
    S.pedidos = await gs('obtenerPedidos');
    this.renderAll();
    this.toast('Pedidos sincronizados.');
  },

  startEditNote(id) {
    const p = S.pedidos.find(x => x.id === id);
    S.ui.editingNoteId = id;
    S.ui.tempNoteText = (p && p.observaciones) || '';
    this.renderMain();
  },

  async saveNote(id) {
    const texto = S.ui.tempNoteText;
    S.ui.editingNoteId = null;
    await this.updateEstado(id, null, texto);
  },

  async updateEstado(id, nuevoEstado, notas) {
    try {
      const cambios = {};
      if (nuevoEstado !== null && nuevoEstado !== undefined) cambios.estado = nuevoEstado;
      if (notas !== undefined) cambios.observaciones = notas;
      const updated = await gs('actualizarPedido', id, cambios);
      const idx = S.pedidos.findIndex(p => p.id === id);
      if (idx >= 0) S.pedidos[idx] = updated;
      this.toast('Pedido actualizado' + (nuevoEstado ? ' a estado: ' + nuevoEstado : '.'));
      this.renderMain();
    } catch (e) {
      this.toast('Error actualizando: ' + (e.message || e));
    }
  },

  async deletePedido(id) {
    if (!confirm('¿Está seguro de eliminar esta solicitud del registro?')) return;
    try {
      await gs('eliminarPedido', id);
      S.pedidos = S.pedidos.filter(p => p.id !== id);
      this.toast('Solicitud eliminada.');
      this.renderMain();
    } catch (e) {
      this.toast('Error eliminando: ' + (e.message || e));
    }
  },

  copyPedidoText(id) {
    const p = S.pedidos.find(x => x.id === id);
    if (!p) return;
    this.copyToClipboard(formatToWhatsAppMessage(p, { formatStyle: 'clasico' }));
    this.toast('Texto copiado.');
  },

  async exportCsv() {
    try {
      const csv = await gs('obtenerCsvPedidos');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'pedidos_judiciales_' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click(); URL.revokeObjectURL(url);
    } catch (e) { this.toast('Error exportando CSV: ' + (e.message || e)); }
  },

  exportJson() {
    const blob = new Blob([JSON.stringify(S.pedidos, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'pedidos_judiciales_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click(); URL.revokeObjectURL(url);
  },

    const list = this.bandejaFiltrados();
    const juzgadosUnicos = [...new Set(S.pedidos.map(p => p.juzgado))].filter(Boolean);

            <button onclick="App.exportCsv()" title="Descargar pedidos filtrados en formato Excel / CSV" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center gap-1"><i data-lucide="sheet" class="w-3.5 h-3.5"></i>CSV</button>

            <button onclick="window.print()" title="Imprimir lista o guardar como PDF" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center gap-1"><i data-lucide="printer" class="w-3.5 h-3.5"></i>Imprimir</button>
          </div>

    if (!confirm('¿Recargar el directorio con los datos originales? Se perderán los cambios manuales.')) return;

    this.toast('Directorio restaurado con los datos iniciales.');
    this.renderMain();

            <button onclick="App.openAddJuzgadoModal()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i>Añadir Juzgado</button>
          </div>` : ''}

        <div class="flex items-center gap-1.5 flex-wrap">
          <button onclick="App.setDirectorioEspecialidad('todos')" class="px-2.5 py-1 rounded-full text-[11px] font-semibold ${S.ui.directorioEspecialidad === 'todos' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}">Todos</button>

        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        ${list.map(j => `
        <div class="bg-white rounded-xl border border-slate-200/80 p-4">
          <div class="flex items-start justify-between gap-2">
            <div>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">${esc(j.especialidad)}</span>

              <p class="text-[11px] text-slate-500">${esc(j.sede || '')}</p>
              ${j.juez ? `<p class="text-[11px] text-slate-600 font-medium mt-0.5">${esc(j.juez)}</p>` : ''}
            </div>
            ${isAdmin ? `<div class="flex gap-1 shrink-0">
              <button onclick="App.openAddJuzgadoModal('${j.id}')" title="Editar juzgado y especialistas" class="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
              <button onclick="App.deleteJuzgado('${j.id}')" title="Eliminar juzgado" class="p-1.5 rounded-lg bg-red-50 hover:bg-red-100 text-red-600"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>

  // ---- Modal Añadir/Editar Juzgado ----

    S.ui.editingJuzgadoId = id || null;
    const j = id ? S.juzgados.find(x => x.id === id) : null;

    root.innerHTML = `

      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">

              <select id="aj-especialidad" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">

              </select>

            <div><label class="block text-xs font-bold text-slate-700 mb-1">Sede</label><input id="aj-sede" type="text" value="${esc(j ? j.sede : 'Sede Central')}" placeholder="Ej: Sede Central / Palacio de Justicia" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
          </div>
          <div><label class="block text-xs font-bold text-slate-700 mb-1">Juez</label><input id="aj-juez" type="text" value="${esc(j ? j.juez : '')}" placeholder="Ej: Dra. SALAS FLORES, ZORAIDA JULIA" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
          <div><label class="text-xs font-bold text-slate-700 flex items-center gap-1.5 mb-1">Especialistas (uno por línea)</label><textarea id="aj-especialistas" rows="5" placeholder="Francis Zegarra Cardenas&#10;GARCIA JURADO MARISOL" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg font-mono">${esc(j ? j.especialistas.join('\n') : '')}</textarea></div>
        </div>
        <div class="p-4 pt-0 flex gap-2 justify-end">
          <button onclick="App.closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button onclick="App.saveJuzgadoModal()" class="px-4 py-2 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg">Guardar</button>
        </div>
      </div>
    </div>`;
    lucide.createIcons();
  },

  async saveJuzgadoModal() {
    const nombre = document.getElementById('aj-nombre').value.trim();
    if (!nombre) { this.toast('El nombre del juzgado es obligatorio.'); return; }
    const juzgado = {
      id: S.ui.editingJuzgadoId || undefined,
      nombre,
      especialidad: document.getElementById('aj-especialidad').value,
      sede: document.getElementById('aj-sede').value.trim(),
      juez: document.getElementById('aj-juez').value.trim(),
      especialistas: document.getElementById('aj-especialistas').value.split('\n').map(s => s.trim()).filter(Boolean)
    };
    try {
      const saved = await gs('guardarJuzgado', juzgado);
      saved.especialistas = juzgado.especialistas;
      const idx = S.juzgados.findIndex(j => j.id === saved.id);
      if (idx >= 0) S.juzgados[idx] = saved; else S.juzgados.unshift(saved);
      this.toast('Juzgado ' + nombre + ' guardado.');
      this.closeModal();
      this.renderMain();
    } catch (e) { this.toast('Error: ' + (e.message || e)); }
  },

    return `

            <div><label class="block text-xs font-bold text-slate-700 mb-1">Teléfono del coordinador (WhatsApp)</label><input id="cfg-telefonoCoordinador" type="text" value="${esc(c.telefonoCoordinador)}" placeholder="51987654321" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
            <div><label class="block text-xs font-bold text-slate-700 mb-1">Enlace del grupo de WhatsApp</label><input id="cfg-enlaceGrupoWhatsapp" type="text" value="${esc(c.enlaceGrupoWhatsapp)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
          </div>
        </div>

        <div class="space-y-2">
          <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider border-b border-slate-200 pb-2">Materias frecuentes</h3>
          <div id="cfg-materias-list" class="flex flex-wrap gap-1.5">
            ${(c.materiasFrecuentes || []).map((m, i) => `<span class="text-[11px] px-2 py-1 rounded-lg bg-slate-100 border border-slate-200 flex items-center gap-1">${esc(m)}<button onclick="App.removeMateria(${i})" class="text-slate-400 hover:text-red-600">×</button></span>`).join('')}

              <input value="${esc(t.descripcion)}" oninput="S.config.tiposTramite[${i}].descripcion=this.value" class="flex-[2] px-2 py-1.5 text-xs border border-slate-300 rounded-lg" placeholder="Descripción breve de ayuda para los abogados...">

  addMateria() {

    S.config.materiasFrecuentes.push(val);
    this.renderMain();
  },
  removeMateria(i) { S.config.materiasFrecuentes.splice(i, 1); this.renderMain(); },
  addTipoTramite() {
    S.config.tiposTramite = S.config.tiposTramite || [];
    S.config.tiposTramite.push({ id: Date.now(), titulo: 'Nuevo tipo de trámite', descripcion: '', icono: 'FileText', tagColor: 'slate' });
    this.renderMain();
  },
  removeTipoTramite(i) { S.config.tiposTramite.splice(i, 1); this.renderMain(); },

  async saveConfig() {
    S.config.nombreGrupo = document.getElementById('cfg-nombreGrupo').value.trim();
    S.config.destinatarioDefault = document.getElementById('cfg-destinatarioDefault').value.trim();
    S.config.telefonoCoordinador = document.getElementById('cfg-telefonoCoordinador').value.trim();

      S.config = await gs('guardarConfig', S.config);
      this.toast('Configuración guardada en el servidor.');
      this.renderAll();

    if (!confirm('¿Restablecer la configuración a los valores por defecto?')) return;
    S.config = await gs('restablecerConfig');
    this.toast('Configuración restablecida a valores iniciales.');
    this.renderAll();

  async changePassword() {
    const cur = document.getElementById('cfg-cur-pass').value;
    const nw = document.getElementById('cfg-new-pass').value;
    const confirm2 = document.getElementById('cfg-confirm-pass').value;
    const msgEl = document.getElementById('cfg-pass-msg');
    if (nw !== confirm2) { msgEl.className = 'text-xs text-red-600'; msgEl.textContent = 'Las contraseñas nuevas no coinciden.'; return; }
    try {
      const res = await gs('cambiarPasswordAdmin', cur, nw);
      msgEl.className = 'text-xs ' + (res.success ? 'text-emerald-700' : 'text-red-600');
      msgEl.textContent = res.message;
      if (res.success) {
        document.getElementById('cfg-cur-pass').value = '';
        document.getElementById('cfg-new-pass').value = '';
        document.getElementById('cfg-confirm-pass').value = '';
      }
    } catch (e) { msgEl.className = 'text-xs text-red-600'; msgEl.textContent = 'Error: ' + (e.message || e); }
  },

  // ============================================================
  // MODALES: Importador rápido / Compartir / Login admin
  // ============================================================
  closeModal() { document.getElementById('modal-root').innerHTML = ''; },

  openImportModal() {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4" onclick="if(event.target===this) App.closeModal()">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
        <div class="bg-slate-900 px-4 py-3 flex items-center justify-between"><h3 class="text-base font-bold text-white flex items-center gap-2"><i data-lucide="clipboard-paste" class="w-4 h-4 text-emerald-400"></i>Pegar mensaje de WhatsApp</h3><button onclick="App.closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button></div>
        <div class="p-4 space-y-3">
          <label class="block text-xs font-bold text-slate-800 uppercase tracking-wider">Texto sin formato</label>
          <textarea id="import-raw" rows="6" placeholder="Pegue aquí el mensaje tal como llegó a WhatsApp..." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg font-mono"></textarea>
          <button onclick="App.runImport()" class="w-full py-2.5 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg">Analizar y Autocompletar</button>
          <div id="import-preview"></div>
        </div>
      </div>
    </div>`;
    lucide.createIcons();
  },

  runImport() {
    const raw = document.getElementById('import-raw').value;
    const parsed = parseRawWhatsAppMessage(raw);
    S.ui.lastParsed = parsed;
    const preview = document.getElementById('import-preview');
    const fields = Object.keys(parsed);
    preview.innerHTML = fields.length
      ? `<div class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs space-y-1">${fields.map(f => `<div><b>${esc(f)}:</b> ${esc(parsed[f])}</div>`).join('')}</div>
         <button onclick="App.applyImport()" class="w-full mt-2 py-2 text-xs font-bold text-white bg-slate-900 rounded-lg">Aplicar al formulario</button>`
      : '<div class="text-xs text-red-600">No se pudo extraer información reconocible del texto.</div>';
  },

  applyImport() {
    const parsed = S.ui.lastParsed || {};
    S.currentPedido = Object.assign({}, S.currentPedido, parsed);
    S.activeTab = 'nuevo';
    this.toast('Datos importados y cargados al formulario.');
    this.closeModal();
    this.renderAll();
  },

  openShareModal() {
    const publicUrl = S.webAppUrl;
    const adminUrl = S.webAppUrl + '?view=admin';
    const broadcastMsg = 'Compañeros, ya está disponible la Mesa de Pedidos Judiciales para registrar y hacer seguimiento a nuestras solicitudes procesales: ' + publicUrl;
    const root = document.getElementById('modal-root');
    root.innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4" onclick="if(event.target===this) App.closeModal()">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
        <div class="bg-slate-900 px-4 py-3 flex items-center justify-between"><h3 class="text-base font-bold text-white flex items-center gap-2"><i data-lucide="share-2" class="w-4 h-4 text-emerald-400"></i>Compartir enlaces</h3><button onclick="App.closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button></div>
        <div class="p-4 space-y-4">
          <div><label class="block text-xs font-bold text-slate-800 mb-1">Enlace público (para los 500 miembros del grupo)</label>
            <div class="flex gap-2"><input readonly value="${esc(publicUrl)}" class="flex-1 px-3 py-2 text-xs border border-slate-300 rounded-lg bg-slate-50"><button onclick="App.copyToClipboard('${publicUrl}'); App.toast('Enlace público copiado.')" class="px-3 py-2 text-xs font-bold bg-slate-800 text-white rounded-lg">Copiar</button></div>
          </div>
          <div><label class="block text-xs font-bold text-amber-900 mb-1">Enlace de administrador (privado)</label>
            <div class="flex gap-2"><input readonly value="${esc(adminUrl)}" class="flex-1 px-3 py-2 text-xs border border-amber-300 rounded-lg bg-amber-50"><button onclick="App.copyToClipboard('${adminUrl}'); App.toast('Enlace admin copiado.')" class="px-3 py-2 text-xs font-bold bg-amber-600 text-white rounded-lg">Copiar</button></div>
          </div>
          <div><label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Mensaje de difusión sugerido</label>
            <div class="bg-[#0b141a] text-[#e9edef] text-xs rounded-xl p-3 whitespace-pre-wrap font-mono mb-2">${esc(broadcastMsg)}</div>
            <button onclick="App.copyToClipboard(${JSON.stringify(broadcastMsg).replace(/"/g, '&quot;')}); App.toast('Mensaje de difusión copiado.')" class="w-full py-2 text-xs font-bold bg-emerald-600 text-white rounded-lg">Copiar mensaje de difusión</button>
          </div>
        </div>
      </div>
    </div>`;
    lucide.createIcons();
  },

  openLoginModal() {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4" onclick="if(event.target===this) App.closeModal()">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
        <div class="bg-slate-900 px-4 py-3 flex items-center justify-between"><h3 class="text-base font-bold text-white">Acceso Administrador</h3><button onclick="App.closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button></div>
        <div class="p-4 space-y-3">
          <label class="block text-xs font-bold text-slate-700">Contraseña</label>
          <input id="login-password" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter'){App.submitLogin(); event.preventDefault();}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
          <div id="login-error" class="text-xs text-red-600"></div>
          <div class="flex gap-2 justify-end pt-1">
            <button onclick="App.closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
            <button onclick="App.submitLogin()" class="px-4 py-2 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg">Ingresar</button>
          </div>
        </div>
      </div>
    </div>`;
    lucide.createIcons();
    document.getElementById('login-password').focus();
  },

  async submitLogin() {
    const pass = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    try {
      const res = await gs('loginAdmin', pass);
      if (res.success) {
        sessionStorage.setItem('admin_auth_token', res.token);
        S.viewMode = 'admin';
        S.activeTab = 'bandeja';
        this.closeModal();
        this.toast('¡Bienvenido al Panel de Administrador!');
        this.renderAll();
      } else {
        errEl.textContent = res.message || 'Contraseña incorrecta';
      }
    } catch (e) { errEl.textContent = 'Error: ' + (e.message || e); }
  },

  adminLogout() {
    sessionStorage.removeItem('admin_auth_token');
    S.viewMode = 'public';
    S.activeTab = 'nuevo';
    this.toast('Sesión de Administrador cerrada.');
    this.renderAll();
  }
};
</script>
